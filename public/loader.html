<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>ShiftSpend — Поэтапная анимация логотипа</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --accent: #4bde80;
      --text: #eef2ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 20px;
    }

    .stage {
      background: var(--card);
      border-radius: 24px;
      padding: 70px 90px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }

    svg {
      width: 380px;
      height: auto;
      display: block;
      overflow: visible;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      appearance: none;
      border: 1px solid #2b3038;
      background: #1c2027;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s ease;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* =========================================================
     CSS КАНВА АНИМАЦИИ
     ========================================================= */

    /* 1. Буква S: Появление в центре и перемещение на место */
    #s-group {
      transform-box: view-box;
      transform-origin: 24px 43.5px;
      transform: translate(50px, -6px) scale(1.6);
      opacity: 0;
    }

    body.play #s-group {
      animation: s-move 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes s-move {
      0% {
        opacity: 0;
        transform: translate(50px, -6px) scale(1.6);
      }

      20% {
        opacity: 1;
        transform: translate(50px, -6px) scale(1.6);
      }

      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    /* 2. Слово hift: Выезд вправо из-под буквы S */
    #hift-group {
      opacity: 0;
      transform: translateX(-45px);
    }

    body.play #hift-group {
      animation: hift-slide 0.75s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }

    @keyframes hift-slide {
      0% {
        opacity: 0;
        transform: translateX(-45px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 3. Слово pend: Выезд вниз из-под hift */
    #pend-group {
      opacity: 0;
      transform: translateY(-22px);
    }

    body.play #pend-group {
      animation: pend-slide 0.75s cubic-bezier(0.16, 1, 0.3, 1) 1.55s forwards;
    }

    @keyframes pend-slide {
      0% {
        opacity: 0;
        transform: translateY(-22px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 4. Купюры: Веерное появление */
    #bill-1,
    #bill-2,
    #bill-3 {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 148px 20px;
    }

    body.play #bill-2 {
      animation: deal 0.8s cubic-bezier(.2, .8, .2, 1) 2.15s forwards;
    }

    body.play #bill-3 {
      animation: deal 0.8s cubic-bezier(.2, .8, .2, 1) 2.30s forwards;
    }

    body.play #bill-1 {
      animation: deal 0.8s cubic-bezier(.2, .8, .2, 1) 2.45s forwards;
    }

    @keyframes deal {
      0% {
        opacity: 0;
        transform: translate(6px, 6px) rotate(6deg) scale(0.85);
      }

      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }
  </style>
</head>

  <div class="controls">
    <button id="replay-btn">↻ Воспроизвести снова</button>
  </div>

  <script>
    const replayBtn = document.getElementById('replay-btn');

    function replayAnimation() {
      document.body.classList.remove('play');
      void document.body.offsetWidth;
      document.body.classList.add('play');
    }

    replayBtn.addEventListener('click', replayAnimation);
  </script>
